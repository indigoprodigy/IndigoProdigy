name: Python tests

on:
  push:
    paths:
      - "projects/universoul-agent-governance/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "projects/universoul-agent-governance/**"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        working-directory: projects/universoul-agent-governance
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
