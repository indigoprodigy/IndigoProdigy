[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universoul-agent-governance"
version = "0.1.0"
description = "A minimal, dependency-free reference policy evaluator for agent tool actions."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = []
